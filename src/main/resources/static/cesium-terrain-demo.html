<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Cesium XYZ + Quantized Mesh 地形测试</title>

    <script src="./Cesium/Cesium.js"></script>
    <link href="./Cesium/Widgets/widgets.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;

            width: 460px;
            max-height: calc(100vh - 20px);
            overflow-y: auto;

            background: rgba(0, 0, 0, 0.86);
            color: #fff;

            padding: 14px 18px;
            border-radius: 8px;

            font: 13px/1.6 "Microsoft YaHei", sans-serif;
        }

        #toolbar h3 {
            margin: 0 0 8px;
            color: #66ccff;
        }

        #toolbar label {
            display: block;
            margin: 8px 0 2px;
            color: #aaa;
            font-size: 12px;
        }

        #toolbar input {
            width: 100%;
            padding: 6px 8px;
            margin-bottom: 2px;

            border: 1px solid #555;
            border-radius: 4px;

            background: #1a1a2e;
            color: #eee;

            font-size: 12px;
        }

        #toolbar button {
            margin: 8px 4px 0 0;
            padding: 6px 14px;

            border: none;
            border-radius: 4px;

            background: #3b82f6;
            color: #fff;

            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        #toolbar button.green {
            background: #16a34a;
        }

        #toolbar button.danger {
            background: #dc2626;
        }

        #toolbar button:hover {
            filter: brightness(1.2);
        }

        #status {
            margin-top: 10px;
            padding: 8px;

            font-size: 11px;
            color: #ccc;

            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;

            min-height: 30px;
            max-height: 160px;

            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div id="cesiumContainer"></div>

<div id="toolbar">

    <h3>🌍 Cesium XYZ + 三维地形</h3>

    <label>XYZ 底图 URL（EPSG:3857）</label>

    <input
            id="xyzUrl"
            value="http://devs.gishub.com.cn:9098/geowebcache/gishub/xyz/arcgis/3857/{z}/{x}/{y}?zxyType=zxy&amp;orginType=wmts"
    >

    <label>Quantized Mesh 地形根目录</label>

    <input
            id="terrainUrl"
            value="http://localhost:12306/outcesium"
    >

    <label>飞到位置（经度,纬度）</label>

    <input
            id="centerLonLat"
            value="87.6,43.8"
    >

    <button class="green" onclick="reloadImagery()">
        🗺 加载 XYZ
    </button>

    <button onclick="loadTerrain()">
        ⛰ 加载地形
    </button>

    <button class="danger" onclick="removeTerrain()">
        ✕ 移除地形
    </button>

    <div id="status">
        正在初始化...
    </div>

</div>


<script>

    var viewer;
    var currentImageryLayer = null;

    // ================================================================
    // 日志
    // ================================================================

    function logStatus(message) {

        console.log(message);

        var status = document.getElementById("status");

        status.textContent =
            new Date().toLocaleTimeString() +
            "  " +
            message +
            "\n" +
            status.textContent;
    }


    // ================================================================
    // 1. 初始化 Cesium
    //
    // 重点：
    // 不要在 Viewer 构造函数里面直接设置 imageryProvider。
    //
    // 先创建一个没有默认底图的 Viewer，
    // 然后通过 imageryLayers.addImageryProvider 手动加载。
    //
    // 这种写法兼容性最好，尤其适合你这个定制 Cesium。
    // ================================================================

    function initCesium() {

        viewer = new Cesium.Viewer("cesiumContainer", {

            animation: false,
            timeline: false,

            baseLayerPicker: false,

            fullscreenButton: false,
            geocoder: false,
            homeButton: false,

            infoBox: false,

            sceneModePicker: false,

            selectionIndicator: false,

            navigationHelpButton: false,

            navigationInstructionsInitiallyVisible: false,

            // 老版本 Cesium
            imageryProvider: false

        });


        // ============================================================
        // 默认使用椭球，不加载 ion terrain
        // ============================================================

        viewer.scene.terrainProvider =
            new Cesium.EllipsoidTerrainProvider();


        // ============================================================
        // 深度检测
        // ============================================================

        viewer.scene.globe.depthTestAgainstTerrain = true;


        // ============================================================
        // 手动加载 XYZ
        // ============================================================

        reloadImagery();


        // ============================================================
        // 初始飞到新疆
        // ============================================================

        viewer.camera.setView({

            destination:
                Cesium.Cartesian3.fromDegrees(
                    87.6,
                    43.8,
                    3000000
                )

        });


        logStatus("✅ Cesium 初始化完成");

    }


    // ================================================================
    // 2. 创建 XYZ 底图
    //
    // 你的底图：
    //
    // EPSG:3857
    // XYZ
    //
    // 所以必须：
    //
    // WebMercatorTilingScheme
    //
    // 注意：
    //
    // {y}
    //
    // Cesium WebMercatorTilingScheme 本身就是：
    //
    // 左上角原点
    // Y 向下
    //
    // 所以标准 XYZ 不需要做 Y 翻转。
    // ================================================================

    function createXyzImageryProvider() {

        var url =
            document
                .getElementById("xyzUrl")
                .value
                .trim();

        if (!url) {
            throw new Error("XYZ URL 不能为空");
        }


        console.log(
            "创建 XYZ Provider：",
            url
        );


        var provider =
            new Cesium.UrlTemplateImageryProvider({

                url: url,

                // ================================================
                // 你的 XYZ 是 EPSG:3857
                // ================================================

                tilingScheme:
                    new Cesium.WebMercatorTilingScheme(),

                tileWidth: 256,

                tileHeight: 256,

                minimumLevel: 0,

                // 根据实际服务调整
                maximumLevel: 20

            });


        // ========================================================
        // XYZ 错误监听
        // ========================================================

        if (provider.errorEvent) {

            provider.errorEvent.addEventListener(
                function (error) {

                    console.error(
                        "XYZ 瓦片加载失败：",
                        error
                    );

                    var msg =
                        "❌ XYZ 请求失败";

                    if (error) {

                        if (error.message) {
                            msg += "\n" + error.message;
                        }

                        if (error.x !== undefined) {

                            msg +=
                                "\nlevel=" +
                                error.level +
                                " x=" +
                                error.x +
                                " y=" +
                                error.y;

                        }

                    }

                    logStatus(msg);

                }
            );

        }


        return provider;

    }


    // ================================================================
    // 3. 加载 / 重新加载 XYZ
    // ================================================================

    function reloadImagery() {

        if (!viewer) {
            return;
        }

        try {

            logStatus(
                "⏳ 开始加载 XYZ..."
            );


            // ========================================================
            // 清空所有影像图层
            // ========================================================

            viewer.imageryLayers.removeAll();


            // ========================================================
            // 创建 Provider
            // ========================================================

            var provider =
                createXyzImageryProvider();


            // ========================================================
            // 真正加入 Cesium
            //
            // 不从 Viewer 构造函数传入。
            // ========================================================

            currentImageryLayer =
                viewer.imageryLayers
                    .addImageryProvider(
                        provider
                    );


            currentImageryLayer.show = true;

            currentImageryLayer.alpha = 1.0;


            logStatus(
                "✅ XYZ Provider 已加入 imageryLayers"
            );


        } catch (e) {

            console.error(
                "XYZ 加载失败：",
                e
            );

            logStatus(
                "❌ XYZ 加载失败：\n" +
                e.message
            );

        }

    }


    // ================================================================
    // 4. 加载 Quantized Mesh 地形
    // ================================================================

    async function loadTerrain() {

        var st = document.getElementById('status');

        var url = document.getElementById('terrainUrl')
            .value
            .trim()
            .replace(/\/layer\.json(?:\?.*)?$/i, '')
            .replace(/\/+$/, '');

        var ll = document
            .getElementById('centerLonLat')
            .value
            .split(',');

        var lon = parseFloat(ll[0]) || 87.6;
        var lat = parseFloat(ll[1]) || 43.8;

        if (!url) {
            st.textContent = '❌ 请输入地形服务地址';
            return;
        }

        st.textContent = '⏳ 正在加载地形...';

        try {

            var tp;

            if (Cesium.CesiumTerrainProvider.fromUrl) {

                tp = await Cesium.CesiumTerrainProvider.fromUrl(
                    url,
                    {
                        requestVertexNormals: false,
                        requestWaterMask: false,
                        requestMetadata: false
                    }
                );

            } else {

                tp = new Cesium.CesiumTerrainProvider({
                    url: url,
                    requestVertexNormals: false,
                    requestWaterMask: false
                });

                if (tp.readyPromise) {
                    await tp.readyPromise;
                }
            }

            // =====================================================
            // 地形异常
            // =====================================================

            var terrainErrorCount = 0;

            tp.errorEvent.addEventListener(function (error) {

                terrainErrorCount++;

                console.warn(
                    '[Terrain 404]',
                    'level=' + error.level,
                    'x=' + error.x,
                    'y=' + error.y,
                    error.message
                );

                // 不重试缺失瓦片
                error.retry = false;

                // 防止大量 404 不断操作 DOM 把浏览器拖死
                if (terrainErrorCount <= 5) {

                    st.textContent =
                        '⚠️ 地形已加载，但存在缺失瓦片\n' +
                        'Level: ' + error.level +
                        '\nX: ' + error.x +
                        '\nY: ' + error.y +
                        '\n错误次数: ' + terrainErrorCount;

                } else if (terrainErrorCount === 6) {

                    st.textContent =
                        '⚠️ 地形存在多个缺失瓦片，已停止输出重复错误。\n' +
                        '请查看浏览器 Console。';

                }

            });

            // =====================================================
            // 设置 Provider
            // =====================================================

            viewer.scene.terrainProvider = tp;

            st.textContent =
                '✅ 地形 Provider 加载成功\n' +
                '正在按 layer.json 的 available 范围加载瓦片';

            // =====================================================
            // 飞到新疆
            // =====================================================

            viewer.camera.flyTo({

                destination:
                    Cesium.Cartesian3.fromDegrees(
                        lon,
                        lat,
                        500000
                    ),

                orientation: {
                    heading: 0,
                    pitch: Cesium.Math.toRadians(-45),
                    roll: 0
                },

                duration: 2
            });

        } catch (e) {

            console.error('地形 Provider 加载失败:', e);

            st.textContent =
                '❌ 地形 Provider 加载失败\n' +
                e.message;

            viewer.scene.terrainProvider =
                new Cesium.EllipsoidTerrainProvider();
        }
    }


    // ================================================================
    // 5. 移除地形
    // ================================================================

    function removeTerrain() {

        viewer.scene.terrainProvider =
            new Cesium
                .EllipsoidTerrainProvider();


        logStatus(
            "✅ 已切回椭球地形"
        );

    }


    // ================================================================
    // 6. XYZ URL 修改时重新加载
    // ================================================================

    document
        .getElementById(
            "xyzUrl"
        )
        .addEventListener(
            "change",
            function () {

                reloadImagery();

            }
        );


    // ================================================================
    // 启动
    // ================================================================

    initCesium();

</script>

</body>
</html>
